*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}

.hero{position:relative;overflow:hidden;background:

.toolbar{padding-top:14px;padding-bottom:13px}
.search{position:relative}

.search input:focus{border-color:#f2a1b1;box-shadow:0 0 0 4px rgba(242,85,112,.10)}
.search svg{position:absolute;left:16px;top:15px;color:#8c7c81}
.clear{position:absolute;right:10px;top:9px;width:34px;height:34px;border:0;border-radius:11px;background:#f7eeee;cursor:pointer;display:none}
.chips{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding:12px 0 1px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;color:#55494d;border-radius:999px;padding:9px 14px;white-space:nowrap;font-size:13px;font-weight:800;cursor:pointer;transition:.18s}
.chip:hover,.chip.active{background:var(--ink);color:white;border-color:var(--ink)}
main{padding:28px 0 74px}
.section{scroll-margin-top:140px;margin:0 0 46px}

.card{display:grid;grid-template-columns:156px 1fr;min-height:156px;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 7px 26px rgba(55,26,32,.045);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s}

.photo{position:relative;background:linear-gradient(140deg,#f7d5d8,#f7eadb);min-height:156px;overflow:hidden}
.photo img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;transition:transform .35s;z-index:2}
.card:hover .photo img{transform:scale(1.035)}
.fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:39px;z-index:1}
.badge{position:absolute;top:10px;left:10px;background:rgba(33,27,29,.88);color:white;font-size:10px;font-weight:900;letter-spacing:.04em;padding:6px 8px;border-radius:999px;backdrop-filter:blur(8px);z-index:3}

.footer-inner{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}

.modal.open{display:flex}
.modal-card{width:min(620px,100%);max-height:92vh;overflow:auto;background:white;border-radius:30px;box-shadow:0 30px 100px rgba(0,0,0,.28);animation:up .22s ease}

 const emoji=emojis[cat]||"🍽️";
 el.innerHTML=`<div class="photo">${it.image?`<img loading="lazy" referrerpolicy="no-referrer" src="${it.image}" alt="${it.name.replace(/"/g,"&quot;")}" onerror="this.style.display='none'">`:""}<div class="fallback">${emoji}</div>${it.badge?`<span class="badge">${it.badge}</span>`:""}</div>
 <div class="card-body"><div class="card-title">${it.name}</div>${it.desc?`<div class="card-desc">${it.desc}</div>`:""}<div class="price">${fmt(it.price)}</div></div>`;
 el.onclick=()=>openModal(it,emoji);
 return el;
}
function render(){
 menuEl.innerHTML=""; let total=0;
 Object.entries(DATA).forEach(([cat,items])=>{
   const filtered=items.filter(it=>(it.name+" "+it.desc+" "+cat).toLowerCase().includes(query));
   if(!filtered.length)return;
   total+=filtered.length;
   const s=document.createElement("section"); s.className="section"; s.id=slug(cat);
   s.innerHTML=`<div class="section-head"><h2>${emojis[cat]||""} ${cat}</h2><span class="section-count">${filtered.length}</span></div><div class="grid"></div>`;
   const g=s.querySelector(".grid"); filtered.forEach(it=>g.appendChild(makeCard(it,cat))); menuEl.appendChild(s);
 });
 empty.style.display=total?"none":"block";
}
search.addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();clear.style.display=query?"block":"none";render()});
clear.onclick=()=>{search.value="";query="";clear.style.display="none";render();search.focus()};

const modal=document.getElementById("modal"), mImg=document.getElementById("modalImg"), mFall=document.getElementById("modalFallback");
function openModal(it,emoji){
 document.getElementById("modalTitle").textContent=it.name;
 document.getElementById("modalDesc").textContent=it.desc||"";
 document.getElementById("modalDesc").style.display=it.desc?"block":"none";
 document.getElementById("modalPrice").textContent=fmt(it.price);
 mFall.textContent=emoji;
 if(it.image){mImg.src=it.image;mImg.style.display="block"}else{mImg.removeAttribute("src");mImg.style.display="none"}
 modal.classList.add("open");document.body.style.overflow="hidden";
}
function closeModal(){modal.classList.remove("open");document.body.style.overflow=""}
document.getElementById("close").onclick=closeModal;
modal.onclick=e=>{if(e.target===modal)closeModal()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

const topbtn=document.getElementById("topbtn");
window.addEventListener("scroll",()=>{
 topbtn.classList.toggle("show",window.scrollY>700);
 let best=null,min=Infinity;
 document.querySelectorAll(".section").forEach(s=>{const d=Math.abs(s.getBoundingClientRect().top-150);if(d<min){min=d;best=s.id}});
 document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",slug(c.dataset.cat)===best));
},{passive:true});
topbtn.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
render();
</script>
</body>
</html>
